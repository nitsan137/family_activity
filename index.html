<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>חמישי משפחתי</title>
<meta name="description" content="מה עושים ביום חמישי בערב: רעיונות, הצבעה משפחתית והיסטוריה">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#17143A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="חמישי">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Karantina:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#17143A; --dusk:#25215C; --dusk-hi:#39348A;
  --paper:#FFFCF2; --ink:#17143A; --ink-soft:#5E5A80; --line:#E3DDF5;
  --amber:#FFB52E; --amber-soft:#FFE6AE;
  --mint:#27BFA3; --mint-soft:#C6F1E7;
  --heart:#FF3D6E; --danger:#B81440;
  --on-night:#F0EEFF; --on-night-soft:#B5B0E8;
  --font:'Fredoka','Rubik','Heebo','Arial Hebrew',Arial,sans-serif;
  --display:'Karantina','Fredoka','Arial Hebrew',Arial,sans-serif;
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;
}
*{box-sizing:border-box}
html{direction:rtl;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--night);color:var(--on-night);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input{font:inherit}
button{color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{opacity:.4;cursor:default}
h1,h2,h3,p,ol{margin:0}
ol{padding:0;list-style:none}
svg{display:block}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.pic{font-family:var(--emoji);line-height:1;white-space:nowrap}

/* מסגרת */
.shell{max-width:520px;margin:0 auto;padding:env(safe-area-inset-top) 16px 170px;min-height:100vh}
.demo{margin:0 -16px;padding:8px 16px;background:var(--amber);color:var(--ink);font-size:14px;font-weight:500;text-align:center}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 4px}
.top h1{font-size:17px;font-weight:600;color:var(--on-night-soft)}
.top-end{display:flex;align-items:center;gap:8px}
.round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--dusk)}
.round svg{width:22px;height:22px;fill:var(--on-night-soft)}
.me{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:99px;background:var(--dusk);font-weight:500}
.me .pic{font-size:22px}
.bar{position:fixed;top:0;left:0;right:0;height:3px;z-index:70;display:none;background:linear-gradient(90deg,transparent,var(--amber),transparent) no-repeat;background-size:50% 100%;animation:slide 1s linear infinite}
body.busy .bar{display:block}
@keyframes slide{from{background-position:150% 0}to{background-position:-50% 0}}

/* פתיח השבוע */
.hero{position:relative;padding:14px 0 6px}
.hero-when{font-family:var(--display);font-weight:700;font-size:84px;line-height:.86;color:var(--amber)}
.hero-date{font-size:19px;font-weight:500;margin-top:10px}
.hero-tie{font-size:14.5px;color:var(--on-night-soft);margin-top:4px}
.moon{position:absolute;top:18px;left:6px;width:58px;height:58px;border-radius:50%;box-shadow:inset 15px -7px 0 0 var(--amber-soft);transform:rotate(-18deg)}
.moon::after{content:"";position:absolute;top:-6px;left:74px;width:4px;height:4px;border-radius:50%;background:var(--on-night);box-shadow:26px 34px 0 -1px var(--on-night-soft),62px 4px 0 0 var(--on-night-soft),10px 72px 0 -1px var(--on-night)}

/* כותרות ואזורים */
.sec{margin-top:26px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-head h2,.page-head h2{font-size:22px;font-weight:600}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 12px}
.hint{font-size:14.5px;color:var(--on-night-soft)}
.gap{margin-top:12px}
.panel{background:var(--dusk);border-radius:20px;padding:16px}
.panel h3{font-size:17px;font-weight:600;margin-bottom:8px}
.pips{display:flex;gap:4px}
.pips svg{width:24px;height:24px;fill:var(--heart)}
.pips .used svg{fill:none;stroke:var(--on-night-soft);stroke-width:2}

/* הודעות קצרות בראש המסך: התקנה וקוד משפחתי */
.notice{display:flex;align-items:center;gap:10px;background:var(--dusk);border:1.5px solid var(--dusk-hi);border-radius:18px;padding:10px 14px;margin-top:12px;font-size:14.5px}
.notice p{flex:1}
.notice .btn{flex:none;min-height:42px;padding:0 14px;font-size:15px}
.notice .x{background:none;width:36px;height:36px}
.notice .x svg{fill:var(--on-night-soft)}
.steps{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.steps li{display:flex;align-items:flex-start;gap:10px}
.steps b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--amber-soft);display:grid;place-items:center;font-size:15px}

/* סינון */
.chips{display:flex;gap:8px;margin-bottom:14px}
.chip{display:flex;align-items:center;gap:6px;min-height:42px;padding:0 15px;border-radius:99px;border:1.5px solid var(--dusk-hi);font-weight:500;font-size:15px}
.chip[aria-pressed="true"]{background:var(--on-night);color:var(--ink);border-color:var(--on-night)}

/* אריחי ההצבעה */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);border-radius:22px;overflow:hidden}
.tile.picked{box-shadow:0 0 0 4px var(--heart)}
.tile-main{flex:1;display:flex;flex-direction:column;width:100%}
.tile-art{height:108px;display:grid;place-items:center;font-size:52px;letter-spacing:2px;background:var(--amber-soft)}
.tile.out .tile-art{background:var(--mint-soft)}
.tile-title{flex:1;padding:10px 12px 0;font-weight:600;font-size:16px;line-height:1.25}
.tile-foot{display:flex;align-items:center;justify-content:space-between;padding:4px 12px 10px}
.tile-place{font-size:13px;color:var(--ink-soft)}
.tile-heart svg{width:34px;height:34px;fill:none;stroke:var(--ink-soft);stroke-width:1.7}
.tile.picked .tile-heart svg{fill:var(--heart);stroke:var(--heart)}
.tile.pop .tile-heart svg{animation:pop .3s ease-out}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
.tile-say{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.72);display:grid;place-items:center}
.tile-say svg{width:20px;height:20px;fill:var(--ink)}
.tile-recent{position:absolute;top:10px;left:8px;background:var(--ink);color:var(--paper);font-size:11.5px;font-weight:500;padding:3px 8px;border-radius:99px}

/* כפתורים */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:16px;font-weight:600;font-size:17px;border:2px solid transparent;text-align:center}
.btn svg{width:22px;height:22px;fill:currentColor;flex:none}
.btn-main{background:var(--amber);color:var(--ink)}
.btn-main:active{transform:translateY(1px)}
.btn-line{border-color:var(--dusk-hi);color:var(--on-night)}
.btn-wide{display:flex;width:100%}
.btn-text{min-height:44px;padding:0 4px;font-weight:500;font-size:15px;text-decoration:underline;text-underline-offset:3px}
body.busy .btn-main{opacity:.6;pointer-events:none}
.savebar{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom));z-index:20;padding:12px 16px;pointer-events:none;background:linear-gradient(transparent,var(--night) 55%)}
.savebar .btn{pointer-events:auto;max-width:488px;margin:0 auto;box-shadow:0 10px 28px rgba(0,0,0,.5)}
.savebar .btn svg{fill:var(--heart)}

/* מי הצביע */
.voters{display:flex;flex-wrap:wrap;gap:14px}
.voter{width:58px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:13px;text-align:center;color:var(--on-night-soft)}
.voter-face{position:relative;width:52px;height:52px;border-radius:50%;background:var(--dusk);display:grid;place-items:center;font-size:27px;opacity:.5}
.voter.done{color:var(--on-night)}
.voter.done .voter-face{opacity:1;box-shadow:0 0 0 3px var(--amber)}
.voter-check{position:absolute;bottom:-4px;left:-4px;width:21px;height:21px;border-radius:50%;background:var(--amber);display:grid;place-items:center}
.voter-check svg{width:15px;height:15px;fill:var(--ink)}

/* תוצאות */
.verdict{background:var(--amber);color:var(--ink);border-radius:18px;padding:14px 16px;font-weight:600;font-size:18px;margin-bottom:10px}
.verdict small{display:block;font-weight:400;font-size:15px;margin-top:2px}
.res{display:flex;flex-direction:column;gap:10px}
.res li{display:flex;align-items:center;gap:12px;background:var(--dusk);border-radius:18px;padding:10px 12px}
.res-pic{flex:none;width:62px;text-align:center;font-size:25px}
.res-body{flex:1;min-width:0}
.res-title{font-weight:600}
.res-bar{height:8px;border-radius:99px;background:var(--dusk-hi);margin:6px 0;overflow:hidden}
.res-bar i{display:block;height:100%;border-radius:99px;background:var(--on-night-soft)}
.res li.win .res-bar i{background:var(--amber)}
.res-who{font-size:17px;letter-spacing:3px}
.res-n{flex:none;width:30px;text-align:center;font-family:var(--display);font-weight:700;font-size:44px;line-height:1}
.res li.win .res-n{color:var(--amber)}
.mix{border:1.5px dashed var(--on-night-soft);border-radius:18px;padding:12px 16px;margin-top:10px;font-size:15px}

/* שורות על נייר: רעיונות ומשפחה */
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;width:100%;background:var(--paper);color:var(--ink);border-radius:18px;padding:10px 14px 10px 12px}
.row-art{flex:none;width:64px;height:60px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--amber-soft)}
.row.out .row-art{background:var(--mint-soft)}
.row.person .row-art{width:60px;background:var(--line);font-size:32px;border-radius:50%}
.row.off{opacity:.6}
.row-body{flex:1;min-width:0}
.row-body>span{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.row-title{font-weight:600;font-size:16.5px;line-height:1.3}
.row-note,.row-meta{font-size:13.5px;color:var(--ink-soft)}
.row-meta a{color:var(--ink);font-weight:500}
.row-edit{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.row-edit svg{width:20px;height:20px;fill:var(--ink-soft)}

/* היסטוריה: כרטיסי כניסה */
.ticket{display:flex;background:var(--paper);color:var(--ink);border-radius:18px;overflow:hidden}
.ticket-date{flex:none;width:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px;background:var(--amber-soft);border-left:2px dashed rgba(23,20,58,.28)}
.ticket.out .ticket-date{background:var(--mint-soft)}
.ticket.combo .ticket-date{background:linear-gradient(var(--amber-soft) 50%,var(--mint-soft) 50%)}
.ticket-day{font-family:var(--display);font-weight:700;font-size:46px;line-height:.9}
.ticket-mon{font-size:13px;font-weight:500;text-align:center}
.ticket-body{flex:1;min-width:0;padding:12px 14px 10px}
.ticket-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.ticket-pics{font-size:24px;letter-spacing:2px}
.ticket-title{font-weight:600;font-size:16.5px;line-height:1.3}
.ticket-note{font-size:14.5px;color:var(--ink-soft);margin-top:2px}
.ticket-foot{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px 8px;margin-top:6px}
.ticket .btn-text{font-size:13.5px;color:var(--ink-soft);min-height:36px}
.tag{flex:none;font-size:12.5px;font-weight:500;padding:2px 10px;border-radius:99px;background:var(--amber-soft)}
.tag.out{background:var(--mint-soft)}
.tag.combo{background:linear-gradient(90deg,var(--mint-soft) 50%,var(--amber-soft) 50%)}
.stars{display:flex;margin:0 -4px}
.stars button{width:34px;height:40px;display:grid;place-items:center}
.stars svg{width:27px;height:27px;fill:none;stroke:var(--ink-soft);stroke-width:1.5}
.stars button.on svg{fill:var(--amber);stroke:#C98200}
.avg{font-size:13.5px;color:var(--ink-soft)}
.hits li{display:flex;align-items:center;gap:10px;padding:6px 0}
.hits .pic{font-size:22px}
.hits-n{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;color:var(--amber);width:16px}
.hits-t{flex:1;font-weight:500}
.hits-s{color:var(--on-night-soft);font-size:14.5px}

/* הגדרות */
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stepper{display:flex;align-items:center;gap:6px;font-weight:600;font-size:20px}
.stepper span{min-width:28px;text-align:center}
.stepper button{width:44px;height:44px;border-radius:50%;background:var(--dusk-hi);display:grid;place-items:center;font-size:24px;line-height:1}

/* בחירת משתמש והקמה */
.who{padding-top:30px}
.who h2{font-family:var(--display);font-weight:700;font-size:64px;line-height:.9;color:var(--amber)}
.who>p{margin:10px 0 20px;color:var(--on-night-soft)}
.faces{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.face{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 10px;border-radius:22px;background:var(--dusk);font-weight:600;font-size:19px;text-align:center}
.face .pic{font-size:58px}
.who-more{display:flex;justify-content:space-between;margin-top:14px}
.added{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.added span.one{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--dusk);font-weight:500}
.card{background:var(--paper);color:var(--ink);border-radius:22px;padding:16px;margin-bottom:12px}
.card .input{margin-bottom:12px}

/* חלונית תחתונה */
.veil{position:fixed;top:0;bottom:0;left:0;right:0;z-index:50;background:rgba(9,7,30,.72);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:90vh;overflow:auto;background:var(--paper);color:var(--ink);border-radius:28px 28px 0 0;padding:16px 18px calc(22px + env(safe-area-inset-bottom))}
.sheet.in{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(28px);opacity:0}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.sheet-head h2{font-size:22px;font-weight:600}
.x{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(23,20,58,.07)}
.x svg{width:22px;height:22px;fill:var(--ink)}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:14.5px;font-weight:500;color:var(--ink-soft);margin-bottom:6px}
.input{display:block;width:100%;height:50px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);padding:0 14px;font-size:17px}
.input:focus{outline:none;border-color:var(--dusk-hi)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:14px;border:2px solid var(--line);font-weight:600}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--amber-soft)}
.seg button.out[aria-pressed="true"]{background:var(--mint-soft)}
.picrow{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.picbig{flex:none;width:104px;height:96px;border-radius:20px;display:grid;place-items:center;font-size:40px;letter-spacing:2px;background:var(--amber-soft)}
.picbig.out{background:var(--mint-soft)}
.pic-hint{display:block;font-size:14.5px;color:var(--ink-soft)}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-bottom:14px}
.emojis button{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:24px}
.emojis button[aria-pressed="true"]{background:var(--amber-soft);box-shadow:inset 0 0 0 2px var(--ink)}
.picks{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.pick{display:flex;align-items:center;gap:8px;min-height:46px;padding:6px 12px;border-radius:14px;border:2px solid var(--line);font-weight:500;font-size:15px;line-height:1.2}
.pick .pic{font-size:20px}
.pick[aria-pressed="true"]{border-color:var(--ink);background:var(--amber-soft)}
.pick.out[aria-pressed="true"]{background:var(--mint-soft)}
.check{display:flex;align-items:center;gap:10px;min-height:44px;margin-bottom:14px;font-weight:500}
.check input{width:22px;height:22px;accent-color:var(--ink)}
.sheet-actions{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:6px}
.danger{color:var(--danger)}
.sheet .btn-line{border-color:var(--line);color:var(--ink)}

/* ניווט תחתון */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--dusk);border-top:1px solid var(--dusk-hi);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:500;color:var(--on-night-soft)}
.nav .pic{font-size:22px;filter:grayscale(1);opacity:.7}
.nav button[aria-current="page"]{color:var(--amber)}
.nav button[aria-current="page"] .pic{filter:none;opacity:1}

/* הודעה קצרה */
#toast{position:fixed;left:16px;right:16px;top:calc(14px + env(safe-area-inset-top));z-index:80;display:flex;justify-content:center;pointer-events:none}
#toast:empty{display:none}
#toast span{max-width:480px;background:var(--on-night);color:var(--ink);padding:10px 16px;border-radius:14px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.45)}

.boot{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center}
.diag{margin-top:14px;max-width:460px;padding:12px 14px;border-radius:14px;background:var(--dusk);font-size:13.5px;color:var(--on-night-soft);text-align:start;word-break:break-word}
.diag p+p{margin-top:6px}
.boot-title{font-family:var(--display);font-weight:700;font-size:64px;line-height:.9;color:var(--amber)}

@media (max-width:350px){.hero-when{font-size:68px}.tile-art{height:92px;font-size:44px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bar" aria-hidden="true"></div>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function () {
  'use strict';

  /* ================= בסיס ================= */

  // הדלת של הגיליון (Google Apps Script). כל הנתונים נשמרים בגיליון של המשפחה.
  // אם הכתובת הראשונה לא עונה כמו דלת, מנסים את השנייה.
  var API_URLS = [
    'https://script.google.com/macros/s/AKfycbzgRypxjI5elrLrGLBUabVv9TuxU_ji41-jSzQmFyNMoE3Sv4UH2ytkNKMLIW9VJUdMMw/exec',
    'https://script.google.com/macros/s/AKfycby5iU-zOV9UBh1NP5te_TEH7y5Q_ApMBBdq3lk1k0W8HErk3FIRmxJs4vyb_snjrqBi6w/exec'
  ];
  var QUERY = (function () { try { return new URLSearchParams(window.location.search); } catch (e) { return null; } })();
  function param(name) { return QUERY ? (QUERY.get(name) || '') : ''; }

    // הגוף נשלח כטקסט פשוט, כדי שהדפדפן לא ישלח לפני כן בקשת הכנה ש-Apps Script לא עונה עליה
    return fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body, redirect: 'follow' })
      .then(function (res) {
        return res.text().then(function (text) {
          var data = null;
          try { data = JSON.parse(text); } catch (e) { data = null; }
          if (!res.ok || !data || typeof data.ok !== 'boolean') {
            // מה שענה הוא לא הדלת: בדרך כלל הגרסה הישנה של Apps Script, או דף כניסה של Google
            var seen = text.replace(/<style[\s\S]*?<\/style>|<script[\s\S]*?<\/script>|<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 140);
            throw new Error('תשובה שאינה מהדלת (HTTP ' + res.status + '): ' + (seen || 'ריקה'));
          }
          return data;
        });
      });
  }

  // שולח פעולות על שורות לדלת של הגיליון, ומעדכן את המצב לפי כל הלשוניות שחוזרות ממנה
  function door(ops, unless) {
    var req = { code: UI.code, schema: SCHEMA, ops: ops || [], unless: unless || null };
    var answer;
    if (!REAL) {
      answer = new Promise(function (resolve) { setTimeout(function () { resolve(demoDoor(req)); }, 150); });
    } else {
      var body = JSON.stringify(req);
      var urls = apiUrl ? [apiUrl] : API_URLS.slice();
      var notes = [];
      var attempt = function (i) {
        return postJson(urls[i], body).then(function (data) { apiUrl = urls[i]; return data; }, function (err) {
          // TypeError מגיע מהדפדפן עצמו: אין רשת, או שהבקשה נחסמה בדרך
          var why = err && err.name === 'TypeError' ? 'הבקשה לא הגיעה ליעד (' + err.message + ')' : String((err && err.message) || err);
          notes.push('כתובת ' + (API_URLS.indexOf(urls[i]) + 1) + ': ' + why);
          if (i + 1 < urls.length) return attempt(i + 1);
          UI.diag = notes;
          throw err;
        });
      };
      answer = attempt(0);
    }
    return answer.then(function (data) {
      if (!data.ok) {
        var err = new Error(data.error || '');
        err.reason = data.reason || '';
        if (err.reason !== 'code') UI.diag = ['הדלת ענתה בשגיאה: ' + (data.error || 'בלי פירוט')];
        throw err;
      }
      UI.diag = null;
      T = data.tables;
      NOW = data.now;
      S = derive(data.hasCode);
      UI.loadedAt = Date.now();
      return data;
    });
  }

  function rowsOf(name) { return (T && T[name]) || []; }
  function rowById(name, id) { var hit = null; rowsOf(name).forEach(function (r) { if (r.id === id) hit = r; }); return hit; }
  function settingOf(key) { var v = ''; rowsOf('settings').forEach(function (r) { if (r.key === key) v = r.value; }); return v; }
  function yes(v) { var t = String(v).toLowerCase(); return t === '1' || t === 'true'; }
  function parseJson(text) {
    try {
      var o = JSON.parse(text || '{}');
      return o && typeof o === 'object' && !Array.isArray(o) ? o : {};
    } catch (e) { return {}; }
  }
  function dayIn(iso) {
    try {
      return new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(iso));
    } catch (e) { return String(iso).slice(0, 10); }
  }

  // בונה מהשורות הגולמיות את המצב שהמסכים מציגים
  function derive(hasCode) {
    var today = dayIn(NOW);
    var weekId = nextThursday(today); // יום חמישי הקרוב, כולל היום. זה המזהה של סבב ההצבעה.
    var stars = {};
    rowsOf('ratings').forEach(function (r) {
      (stars[r.historyId] || (stars[r.historyId] = {}))[r.memberId] = Number(r.stars) || 0;
    });
    var perPerson = Math.round(Number(settingOf('votesPerPerson')));
    return {
      today: today,
      weekId: weekId,
      members: rowsOf('members').map(function (m) { return { id: m.id, name: m.name, emoji: m.emoji, active: yes(m.active) }; }),
      ideas: rowsOf('ideas').map(function (i) {
        return { id: i.id, title: i.title, pic: i.pic, place: i.place === 'out' ? 'out' : 'home', note: i.note || '', addedBy: i.addedBy || '', archived: yes(i.archived) };
      }),
      votes: rowsOf('votes').filter(function (v) { return v.weekId === weekId; })
        .map(function (v) { return { memberId: v.memberId, ideaId: v.ideaId }; }),
      history: rowsOf('history').map(function (x) {
        // דירוגים מהגרסה הראשונה נשמרו בתוך שורת ההיסטוריה. הלשונית של הדירוגים גוברת עליהם.
        var ratings = parseJson(x.ratings);
        var newer = stars[x.id] || {};
        Object.keys(newer).forEach(function (k) { ratings[k] = newer[k]; });
        Object.keys(ratings).forEach(function (k) { if (!(Number(ratings[k]) > 0)) delete ratings[k]; });
        return { id: x.id, date: x.date, ideaIds: x.ideaIds ? x.ideaIds.split(',') : [], titles: x.titles, type: x.type, note: x.note || '', ratings: ratings };
      }),
      settings: {
        votesPerPerson: perPerson >= 1 && perPerson <= 5 ? perPerson : 3,
        revealedWeek: settingOf('revealedWeek'),
        hasCode: !!hasCode
      }
    };
  }

  /* ================= הפעולות של האפליקציה ================= */

  function clean(value, max) {
    var text = String(value === undefined || value === null ? '' : value).replace(/[\r\n\t]+/g, ' ').trim().replace(/^[=+]+/, '').trim();
    return Array.from(text).slice(0, max).join('');
  }
  function newId(prefix) {
    var bytes = new Uint8Array(4);
    window.crypto.getRandomValues(bytes);
    return prefix + '_' + Array.prototype.map.call(bytes, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
  }
  function stamp() { return new Date().toISOString().slice(0, 19); }
  function fail(text) { throw new Error(text); }
  function setting(key, value) {
    return { op: 'upsert', table: 'settings', match: { key: key }, row: { key: key, value: String(value) } };
  }

  // כל פעולה מתורגמת כאן לפעולות על שורות בגיליון. הבדיקות נעשות כאן, והדלת רק כותבת.
  var ACTIONS = {
    getState: function () { return { ops: [] }; },

    addMember: function (p) {
      var name = clean(p.name, 30);
      if (!name) fail('חסר שם');
      var id = newId('m');
      return { created: id, ops: [{ op: 'append', table: 'members', row: { id: id, name: name, emoji: clean(p.emoji, 8) || '🙂', active: '1', createdAt: stamp() } }] };
    },

    updateMember: function (p) {
      if (!rowById('members', p.id)) fail('הרשומה לא נמצאה');
      var set = {};
      if (p.name !== undefined) { set.name = clean(p.name, 30); if (!set.name) fail('חסר שם'); }
      if (p.emoji !== undefined && clean(p.emoji, 8)) set.emoji = clean(p.emoji, 8);
      if (p.active !== undefined) set.active = p.active ? '1' : '';
      return { ops: [{ op: 'update', table: 'members', match: { id: p.id }, set: set }] };
    },

    addIdea: function (p) {
      var title = clean(p.title, 60);
      if (!title) fail('חסר שם לרעיון');
      var place = p.place === 'out' ? 'out' : 'home';
      var id = newId('i');
      return { created: id, ops: [{ op: 'append', table: 'ideas', row: {
        id: id, title: title, pic: clean(p.pic, 12) || placePic(place), place: place,
        note: clean(p.note, 140), addedBy: clean(p.addedBy, 20), createdAt: stamp(), archived: ''
      } }] };
    },

    updateIdea: function (p) {
      if (!rowById('ideas', p.id)) fail('הרשומה לא נמצאה');
      var set = {};
      if (p.title !== undefined) { set.title = clean(p.title, 60); if (!set.title) fail('חסר שם לרעיון'); }
      if (p.place !== undefined) set.place = p.place === 'out' ? 'out' : 'home';
      if (p.pic !== undefined && clean(p.pic, 12)) set.pic = clean(p.pic, 12);
      if (p.note !== undefined) set.note = clean(p.note, 140);
      if (p.archived !== undefined) set.archived = p.archived ? '1' : '';
      return { ops: [{ op: 'update', table: 'ideas', match: { id: p.id }, set: set }] };
    },

    setVotes: function (p) {
      if (!rowById('members', p.memberId)) fail('לא מצאנו את מי שמצביע');
      var ids = [];
      (p.ideaIds || []).forEach(function (id) {
        var row = rowById('ideas', id);
        if (row && !yes(row.archived) && ids.indexOf(id) < 0) ids.push(id);
      });
      if (ids.length > S.settings.votesPerPerson) fail('אפשר לבחור עד ' + S.settings.votesPerPerson + ' רעיונות');
      var ops = [{ op: 'remove', table: 'votes', match: { weekId: S.weekId, memberId: p.memberId } }];
      ids.forEach(function (id) {
        ops.push({ op: 'append', table: 'votes', row: { weekId: S.weekId, memberId: p.memberId, ideaId: id, createdAt: stamp() } });
      });
      return { ops: ops };
    },

    reveal: function () { return { ops: [setting('revealedWeek', S.weekId)] }; },

    markDone: function (p) {
      var date = String(p.date || '');
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) fail('תאריך לא תקין');
      var chosen = [];
      (p.ideaIds || []).forEach(function (id) {
        var row = rowById('ideas', id);
        if (row && chosen.indexOf(row) < 0) chosen.push(row);
      });
      if (!chosen.length) fail('בחרו מה עשיתם');
      if (chosen.length > 2) fail('אפשר לשלב עד שני רעיונות בערב אחד');
      var places = chosen.map(function (row) { return row.place === 'out' ? 'out' : 'home'; });
      var id = newId('h');
      return { created: id, ops: [{ op: 'append', table: 'history', row: {
        id: id, date: date,
        ideaIds: chosen.map(function (row) { return row.id; }).join(','),
        titles: chosen.map(function (row) { return row.title; }).join(' + '),
        type: places.indexOf('home') >= 0 && places.indexOf('out') >= 0 ? 'combo' : places[0],
        note: clean(p.note, 200), createdBy: clean(p.createdBy, 20), createdAt: stamp()
      } }] };
    },

    // דירוג 0 פירושו "בלי דירוג". שורה אחת לכל זוג של ערב ומדרג, כך ששני דירוגים באותו רגע לא דורסים זה את זה.
    rate: function (p) {
      var stars = Math.round(Number(p.stars));
      if (!(stars >= 0 && stars <= 5)) fail('דירוג לא תקין');
      if (!rowById('members', p.memberId)) fail('לא מצאנו את מי שמדרג');
      if (!rowById('history', p.historyId)) fail('הרשומה לא נמצאה');
      return { ops: [{ op: 'upsert', table: 'ratings', match: { historyId: p.historyId, memberId: p.memberId },
        row: { historyId: p.historyId, memberId: p.memberId, stars: String(stars), createdAt: stamp() } }] };
    },

    deleteHistory: function (p) {
      if (!rowById('history', p.id)) fail('הרשומה לא נמצאה');
      return { ops: [
        { op: 'remove', table: 'history', match: { id: p.id } },
        { op: 'remove', table: 'ratings', match: { historyId: p.id } }
      ] };
    },

    setVotesPerPerson: function (p) {
      var n = Math.round(Number(p.value));
      if (!(n >= 1 && n <= 5)) fail('אפשר לבחור בין 1 ל-5 לבבות');
      return { ops: [setting('votesPerPerson', n)] };
    },

    setFamilyCode: function (p) { return { ops: [{ op: 'setCode', code: String(p.code || '').trim() }] }; }
  };

  function rpc(action, payload) {
    var plan;
    try {
      if (!ACTIONS[action]) fail('פעולה לא מוכרת: ' + action);
      plan = ACTIONS[action](payload || {});
    } catch (e) {
      return Promise.reject(e);
    }
    return door(plan.ops).then(function () { return { state: S, created: plan.created || null }; });
  }

  /* ================= שינויים שמגיעים מהמאגר ================= */

  // data/patches.json במאגר הוא הדרך לשנות נתונים בלי לפתוח את הגיליון.
  // כל שינוי שם מוחל על הגיליון פעם אחת, בפתיחה הבאה של האפליקציה אצל מישהו מהמשפחה.
  var PATCHES = {
    addIdea: function (c, titles) {
      var title = clean(c.title, 60);
      if (!title || titles[title]) return []; // רעיון שכבר קיים (גם אם הוסר) לא מתווסף שוב
      titles[title] = true;
      var place = c.place === 'out' ? 'out' : 'home';
      return [{ op: 'append', table: 'ideas', row: {
        id: newId('i'), title: title, pic: clean(c.pic, 12) || placePic(place), place: place,
        note: clean(c.note, 140), addedBy: '', createdAt: stamp(), archived: ''
      } }];
    },
    editIdea: function (c) {
      var from = c.set || {};
      var set = {};
      if (from.title !== undefined && clean(from.title, 60)) set.title = clean(from.title, 60);
      if (from.pic !== undefined && clean(from.pic, 12)) set.pic = clean(from.pic, 12);
      if (from.place !== undefined) set.place = from.place === 'out' ? 'out' : 'home';
      if (from.note !== undefined) set.note = clean(from.note, 140);
      return Object.keys(set).length ? [{ op: 'update', table: 'ideas', match: { title: clean(c.title, 60) }, set: set }] : [];
    },
    removeIdea: function (c) { return [{ op: 'update', table: 'ideas', match: { title: clean(c.title, 60) }, set: { archived: '1' } }]; },
    restoreIdea: function (c) { return [{ op: 'update', table: 'ideas', match: { title: clean(c.title, 60) }, set: { archived: '' } }]; },
    editMember: function (c) {
      var from = c.set || {};
      var set = {};
      if (from.name !== undefined && clean(from.name, 30)) set.name = clean(from.name, 30);
      if (from.emoji !== undefined && clean(from.emoji, 8)) set.emoji = clean(from.emoji, 8);
      if (from.active !== undefined) set.active = from.active ? '1' : '';
      return Object.keys(set).length ? [{ op: 'update', table: 'members', match: { name: clean(c.name, 30) }, set: set }] : [];
    },
    setHearts: function (c) {
      var n = Math.round(Number(c.value));
      return n >= 1 && n <= 5 ? [setting('votesPerPerson', n)] : [];
    },
    removeEvening: function (c) {
      var ops = [];
      rowsOf('history').forEach(function (x) {
        if (x.date !== c.date || (c.titles && x.titles !== c.titles)) return;
        ops.push({ op: 'remove', table: 'history', match: { id: x.id } });
        ops.push({ op: 'remove', table: 'ratings', match: { historyId: x.id } });
      });
      return ops;
    }
  };

  function applyPatch(patch) {
    var titles = {};
    rowsOf('ideas').forEach(function (r) { titles[r.title] = true; });
    var ops = [];
    (Array.isArray(patch.changes) ? patch.changes : []).forEach(function (c) {
      var make = c && PATCHES[c.do];
      if (make) ops = ops.concat(make(c, titles));
    });
    var key = 'patch:' + patch.id;
    ops.push(setting(key, stamp()));
    // הדלת מדלגת אם מכשיר אחר כבר החיל את השינוי הזה באותו רגע
    return door(ops, { table: 'settings', match: { key: key } });
  }

  function applyPatches() {
    if (!REAL) return Promise.resolve(0);
    return fetch('data/patches.json', { cache: 'no-store' })
      .then(function (res) { return res.ok ? res.json() : []; })
      .then(function (list) {
        var done = {};
        rowsOf('settings').forEach(function (r) { if (r.key.indexOf('patch:') === 0) done[r.key.slice(6)] = true; });
        var pending = (Array.isArray(list) ? list : []).filter(function (patch) {
          return patch && /^[A-Za-z0-9_.-]{1,50}$/.test(String(patch.id)) && !done[patch.id];
        });
        return pending.reduce(function (chain, patch) {
          return chain.then(function () { return applyPatch(patch); });
        }, Promise.resolve()).then(function () { return pending.length; });
      })
      .catch(function (err) { if (window.console) console.warn('patches', err); return 0; });
  }

  // מריץ פעולה, מעדכן את המצב ומצייר מחדש. מחזיר null אם הפעולה נכשלה (אחרי הודעה למשתמש).
  function call(action, payload) {
    UI.busy++;
    document.body.classList.add('busy');
    return rpc(action, payload).then(function (res) {
      S = res.state;
      UI.loadedAt = Date.now();
      return res;
    }, function (err) {
      if (err && err.reason === 'code') {
        // אין קוד במכשיר הזה, או שהקוד הוחלף: מבקשים אותו מחדש
        UI.needCode = true;
        saveCode('');
        if (UI.triedCode) toast('הקוד לא מתאים. מנסים שוב?');
        return null;
      }
      if (window.console) console.error(err);
      var msg = err && err.message ? String(err.message).replace(/^(Error|Exception):\s*/, '') : '';
      toast(msg && /[֐-׿]/.test(msg) ? msg : 'הפעולה לא הצליחה. בדקו את החיבור ונסו שוב.');
      return null;
    }).then(function (res) {
      UI.busy--;
      if (!UI.busy) document.body.classList.remove('busy');
      render();
      return res;
    });
  }

  var toastTimer = null;
  function toast(text) {
    var box = document.getElementById('toast');
    box.replaceChildren(h('span', null, text));
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { box.replaceChildren(); }, 2800);
  }

  function loadCode() { try { return window.localStorage.getItem('thursday_code') || ''; } catch (e) { return ''; } }
  function saveCode(code) {
    try {
      if (code) window.localStorage.setItem('thursday_code', code); else window.localStorage.removeItem('thursday_code');
    } catch (e) { /* בלי שמירה מקומית */ }
  }
  function flag(name, value) {
    try {
      if (value === undefined) return window.localStorage.getItem(name) === '1';
      window.localStorage.setItem(name, value ? '1' : '');
    } catch (e) { /* בלי שמירה מקומית */ }
    return !!value;
  }
  function loadMe() { try { return window.localStorage.getItem('thursday_me') || ''; } catch (e) { return ''; } }
  function saveMe(id) { try { window.localStorage.setItem('thursday_me', id); } catch (e) { /* בלי שמירה מקומית */ } }
  function setMe(id) {
    UI.me = id; UI.askWho = false; UI.draft = null;
    saveMe(id);
    render();
  }

  /* ================= פעולות ================= */

  function toggleVote(id) {
    var who = me();
    if (who && !who.active) { toast('סימנתם ש' + who.name + ' לא בהצבעות כרגע. אפשר לשנות בלשונית משפחה.'); return; }
    var d = currentDraft().slice();
    var at = d.indexOf(id);
    if (at >= 0) {
      d.splice(at, 1);
    } else {
      if (d.length >= S.settings.votesPerPerson) { toast('נגמרו הלבבות. מורידים לב מרעיון אחר כדי להחליף.'); return; }
      d.push(id);
      UI.pop = id;
    }
    UI.draft = d;
    render();
    UI.pop = '';
  }
  function saveVotes() {
    call('setVotes', { memberId: UI.me, ideaIds: currentDraft() }).then(function (res) {
      if (!res) return;
      UI.draft = null;
      toast('ההצבעה נשמרה');
      render();
    });
  }
  function rate(x, stars) {
    var mine = x.ratings[UI.me] || 0;
    call('rate', { historyId: x.id, memberId: UI.me, stars: mine === stars ? 0 : stars });
  }
  function closeModal() { UI.modal = null; render(); }

  function openIdea(i) {
    UI.modal = i
      ? { type: 'idea', id: i.id, title: i.title, place: i.place, note: i.note || '', pics: picsOf(i), manual: true, picker: false, fresh: true }
      : { type: 'idea', id: '', title: '', place: UI.bankFilter === 'out' ? 'out' : 'home', note: '', pics: [], manual: false, picker: false, fresh: true };
    render();
  }
  function shownPics(m) { return m.pics.length ? m.pics : [placePic(m.place)]; }
  function saveIdea() {
    var m = UI.modal;
    var title = m.title.trim();
    if (!title) { toast('כתבו מה עושים'); return; }
    var data = { title: title, place: m.place, note: m.note, pic: shownPics(m).join(' ') };
    if (m.id) data.id = m.id; else data.addedBy = UI.me;
    call(m.id ? 'updateIdea' : 'addIdea', data).then(function (res) {
      if (!res) return;
      UI.modal = null;
      toast('הרעיון נשמר');
      render();
    });
  }
  function removeIdea() {
    var m = UI.modal;
    call('updateIdea', { id: m.id, archived: true }).then(function (res) {
      if (!res) return;
      UI.modal = null;
      if (UI.draft) UI.draft = UI.draft.filter(function (id) { return id !== m.id; });
      toast('הרעיון הוסר מהרשימה');
      render();
    });
  }

  function openMember(m) {
    UI.modal = m
      ? { type: 'member', id: m.id, name: m.name, emoji: m.emoji, active: m.active, fresh: true }
      : { type: 'member', id: '', name: '', emoji: freeEmoji(), active: true, fresh: true };
    render();
  }
  function freeEmoji() {
    var used = S.members.map(function (m) { return m.emoji; });
    for (var i = 0; i < MEMBER_EMOJIS.length; i++) if (used.indexOf(MEMBER_EMOJIS[i]) < 0) return MEMBER_EMOJIS[i];

  var D = null;
  function demoFind(name, match) {
    return (D[name] || []).filter(function (r) {
      return Object.keys(match).every(function (k) { return String(r[k] === undefined ? '' : r[k]) === String(match[k]); });
    });
  }
  function demoDoor(req) {
    if (!D) D = demoTables();
    var skipped = !!(req.unless && demoFind(req.unless.table, req.unless.match).length);
    if (!skipped) {
      req.ops.forEach(function (op) {
        var rows = D[op.table] || (D[op.table] = []);
        var hits = op.match ? demoFind(op.table, op.match) : [];
        if (op.op === 'append') rows.push(Object.assign({}, op.row));
        else if (op.op === 'update') hits.forEach(function (r) { Object.assign(r, op.set); });
        else if (op.op === 'upsert') { if (hits.length) hits.forEach(function (r) { Object.assign(r, op.row); }); else rows.push(Object.assign({}, op.row)); }
        else if (op.op === 'remove') D[op.table] = rows.filter(function (r) { return hits.indexOf(r) < 0; });
      });
    }
    return { ok: true, skipped: skipped, hasCode: true, now: new Date().toISOString(), tables: JSON.parse(JSON.stringify(D)) };
  }

    var week = nextThursday(dayIn(new Date().toISOString()));

      ['גן שעשועים בחושך עם פנסים', '🎠 🔦', 'out']
    ];
    return {
      members: [['m1', 'אבא', '🦁'], ['m2', 'אמא', '🦊'], ['m3', 'נועה', '🦄'], ['m4', 'מיקה', '🐼']].map(function (m) {

      history: [
        { id: 'h1', date: addDays(week, -7), ideaIds: 'd7', titles: 'באולינג', type: 'out', note: 'נועה עשתה סטרייק', createdBy: 'm1', createdAt: '' },
        { id: 'h2', date: addDays(week, -14), ideaIds: 'd6,d1', titles: 'גלידה וטיול ערב + ערב סרט עם פופקורן', type: 'combo', note: '', createdBy: 'm2', createdAt: '' },
        { id: 'h3', date: addDays(week, -21), ideaIds: 'd2', titles: 'משחקי קופסה', type: 'home', note: '', createdBy: 'm2', createdAt: '' }
      ],

      try { window.history.replaceState(null, '', window.location.pathname + (param('demo') === '1' ? '?demo=1' : '')); } catch (e) { /* לא קריטי */ }

    if (!document.hidden && S && !UI.busy && Date.now() - UI.loadedAt > 20000) call('getState');
  });

  // עובד שירות: מאפשר התקנה ופתיחה של המעטפת גם בלי רשת. רץ רק מאתר אמיתי, לא מקובץ מקומי.
  if ('serviceWorker' in NAV && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
    window.addEventListener('load', function () {
      NAV.serviceWorker.register('sw.js').catch(function () { /* האפליקציה עובדת גם בלי זה */ });
    });
  }

  boot();
})();
</script>
